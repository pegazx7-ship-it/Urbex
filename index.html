<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Urbex">
<meta name="theme-color" content="#1c1917">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Urbex</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--ac:#c2410c;--bd:#e2e2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131312;--card:#1e1e1c;--tx:#ececE8;--mut:#9a9a93;--ac:#fb923c;--bd:#33332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131312;--card:#1e1e1c;--tx:#ececE8;--mut:#9a9a93;--ac:#fb923c;--bd:#33332f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;margin:8px 0 14px}h2{font-size:13px;margin:20px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:48px;padding:12px 16px;background:var(--ac);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button.s,.btn.s{background:var(--bd);color:var(--tx)}button.w{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar button{flex:1;background:none;color:var(--mut);border-radius:0;min-height:58px;font-size:13px;flex-direction:column;gap:2px}
.bar button.on{color:var(--ac)}.bar span{font-size:22px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.top button{min-height:40px;padding:6px 12px}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:14px}.now{border:2px solid var(--ac)}.done{opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
iframe{width:100%;height:200px;border:0;border-radius:12px;background:var(--bd);margin:8px 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:#000e;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:9}
.ov img{flex:1;min-height:0;object-fit:contain;width:100%}
@media(min-width:900px){main{max-width:780px}}
.bigin{font-size:22px;font-weight:700}
.go{width:100%;min-height:64px;font-size:20px;margin-top:10px}
.ok{border:2px solid var(--ac)}
textarea{resize:vertical}
details>summary{cursor:pointer;padding:10px 0;color:var(--mut)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=t=>new Date(t).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const money=v=>v.toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const gm=l=>'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng;
let S={w:[],cur:null,tab:'d'};
const wide=()=>window.matchMedia&&window.matchMedia('(min-width:900px)').matches;
try{Object.assign(S,JSON.parse(localStorage.getItem('urbex_v2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('urbex_v2',JSON.stringify(S))}catch(e){}};
const W=()=>S.w.find(x=>x.id===S.cur);
let gpsMsg='Śledzenie wyłączone. Działa przy włączonym ekranie.',wid=null;

/* ---------- IndexedDB (zdjęcia) ---------- */
let db=null;
const openDB=()=>new Promise(res=>{try{const r=indexedDB.open('urbex_v2',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const st=m=>db.transaction('p',m).objectStore('p');
const photos=async id=>{db=db||await openDB();if(!db)return[];
  return new Promise(r=>{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result.filter(p=>p.wid===id));q.onerror=()=>r([])})};

/* ---------- widoki ---------- */
function stats(w){
  const l=+w.l,k=+w.km,p=+w.p;
  return{cost:l&&p?l*p:null,l100:k&&l?l/k*100:null,ck:k&&l&&p?l*p/k:null};
}
function render(){
  const w=W(),app=$('#app');
  if(!w){
    app.innerHTML=`<h1>Urbex</h1><button class="w" data-a="new">+ Nowa wyprawa</button><button class="s w" data-a="pull" style="margin-top:8px">⬇ Pobierz trasę z chmury</button><div id="sy" class="mut" style="margin-top:6px"></div><h2>Wyprawy</h2>`+
    ([...S.w].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{
      const s=stats(x),v=x.locs.filter(l=>l.done).length;
      return `<div class="card" data-a="open" data-id="${x.id}"><b>${esc(x.name)}</b> <span class="mut">${x.date}</span>
      <div class="mut">${v}/${x.locs.length} miejsc · ${x.pc||0} zdjęć${s.cost!==null?' · '+money(s.cost):''}${s.l100!==null?' · '+s.l100.toFixed(1)+' l/100':''}</div></div>`}).join('')
      ||'<div class="mut">Jeszcze nie masz żadnej wyprawy. Dotknij przycisku powyżej.</div>')+`<h2>Ustawienia</h2><div class="card"><label>Adres Workera (Cloudflare)</label><input id="wk" value="${esc(S.worker||'')}" placeholder="https://urbex.TWOJA-NAZWA.workers.dev" autocapitalize="off"><label>Hasło dostępu</label><input id="kk" type="password" value="${esc(S.key||'')}" autocomplete="off"><button class="s w" data-a="wk">Zapisz</button></div>`;
    return;
  }
  if(S.tab==='m')S.tab='d';
  if(wide()){
    app.innerHTML=`<div class="top"><button class="s" data-a="back">‹ Wyprawy</button><b>${esc(w.name)}</b> <span class="mut">planowanie trasy</span></div><div id="body"></div>`;
    viewPlan(w);return;
  }
  const tabs=[['d','🚗','Jazda'],['f','📷','Zdjęcia'],['k','⛽','Koszt']];
  app.innerHTML=`<div class="top"><button class="s" data-a="back">‹ Wyprawy</button><b>${esc(w.name)}</b></div><div id="body"></div>
  <div class="bar">${tabs.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${S.tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`;
  ({d:viewDrive,f:viewF,k:viewK})[S.tab](w);
}
const short=(t,n=40)=>{t=String(t||'').replace(/\s+/g,' ').trim();return t?(t.length>n?t.slice(0,n)+'…':t):'Bez opisu'};
const pt=p=>p?`<b>${esc(p.name)}</b> <span class="mut">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>`:'<span class="mut">nie ustawiono</span>';
const linkRow=l=>`<label>Link</label><div style="margin:4px 0 10px"><a href="${gm(l)}" target="_blank" rel="noopener" style="color:var(--ac);word-break:break-all">${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} ↗</a></div>`;
const fields=l=>`<label>Trasa</label><textarea rows="2" data-lid="${l.id}" data-f="name" placeholder="Co to za miejsce, np. Stara fabryka, wejście od tyłu">${esc(l.name||'')}</textarea>${linkRow(l)}`;
const mapLinks=l=>`<a class="btn s" href="https://www.google.com/maps/@?api=1&map_action=map&center=${l.lat},${l.lng}&zoom=18&basemap=satellite" target="_blank" rel="noopener">Satelita</a>`;
function nextUrl(w){
  const stops=w.locs.filter(l=>!l.done).concat(w.dest?[w.dest]:[]);
  if(!stops.length)return null;
  const av=[w.tolls!==false?'tolls':'',w.hw?'highways':''].filter(Boolean).join('%7C');
  const f=p=>p.lat+','+p.lng,ch=stops.slice(0,10),d=ch[ch.length-1],wp=ch.slice(0,-1);
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+f(d);
  if(wp.length)u+='&waypoints='+wp.map(f).join('%7C');
  if(av)u+='&avoid='+av;
  return u;
}
function viewPlan(w){
  const todo=w.locs.filter(l=>!l.done),lg=w.routed?legs(w):[];
  $('#body').innerHTML=`
  <h2>1 · Start</h2><div class="card">${w.start?pt(w.start):'<span class="mut">Moja lokalizacja (pobierana przy układaniu trasy)</span>'}
   <input id="si" placeholder="Miasto lub link Google Maps" style="margin-top:10px">
   <div class="row"><button class="s" data-a="sg">📍 Moja lokalizacja</button><button data-a="ss">Ustaw start</button></div></div>
  <h2>2 · Cel podróży</h2><div class="card">${pt(w.dest)}
   <input id="di" placeholder="Miasto lub link Google Maps" style="margin-top:10px"><button class="w" data-a="ds">Ustaw cel</button></div>
  <h2>3 · Miejsca urbexu (${todo.length})</h2><div class="card">
   <label>Wklej link z Google Maps, współrzędne lub nazwę miejscowości. Kilka naraz, każde w osobnej linii. Opcjonalnie „Co to za miejsce | link”.</label>
   <textarea id="paste" rows="3" placeholder="Stara fabryka | https://www.google.com/maps/@52.40,16.92,17z"></textarea>
   <button class="w" data-a="add">+ Dodaj do listy</button><div id="msg" class="mut" style="margin-top:8px"></div></div>
  ${todo.map((l,i)=>`<div class="card"><b>${i+1}.</b>${fields(l)}
   <div class="row">${mapLinks(l)}<button class="s" data-a="dl" data-id="${l.id}">Usuń</button></div></div>`).join('')}
  ${todo.length?`<h2>4 · Trasa</h2><div class="card">
   <label style="display:flex;gap:10px;align-items:center;font-size:16px;color:var(--tx)"><input type="checkbox" id="o-t" style="width:24px;margin:0" ${w.tolls!==false?'checked':''}>Unikaj płatnych dróg</label>
   <label style="display:flex;gap:10px;align-items:center;font-size:16px;color:var(--tx);margin:10px 0"><input type="checkbox" id="o-h" style="width:24px;margin:0" ${w.hw?'checked':''}>Unikaj autostrad i dróg ekspresowych</label>
   <button class="w" data-a="rt">Ułóż kolejność miejsc</button>
   ${w.routed?`<div class="mut" style="margin:10px 0">Kolejność ułożona od startu do celu. Szacunkowo ok. ${w.est} km. Podgląd całej trasy:</div>
   ${lg.map((x,i)=>`<a class="btn s w" style="margin-top:8px" href="${x.u}" target="_blank" rel="noopener">Zobacz trasę w Google Maps · część ${i+1} (${x.n} pkt) ›</a>`).join('')}`:''}</div>`:''}
  <h2>5 · Wyślij na telefon</h2><div class="card"><button class="w" data-a="push">⬆ Wyślij trasę do chmury</button><div id="sy" class="mut" style="margin-top:8px"></div></div>
  <h2>Wyprawa</h2><div class="card"><div class="row"><div><label>Nazwa</label><input id="wn" value="${esc(w.name)}"></div><div><label>Data</label><input id="wd" type="date" value="${w.date}"></div></div>
   <button class="s w" data-a="delw">Usuń całą wyprawę</button></div>`;
}
function viewDrive(w){
  const todo=w.locs.filter(l=>!l.done),done=w.locs.filter(l=>l.done).sort((a,b)=>b.done-a.done),c=todo[0];
  const al=w.arrived&&w.locs.find(x=>x.id===w.arrived.id),url=nextUrl(w);
  let main;
  if(al){
    const nm=c?short(c.name):(w.dest?'cel: '+w.dest.name:'');
    main=`<div class="card ok"><div class="mut">${w.arrived.auto?'Jesteś na miejscu':'Dotarłem'} · ${fmt(w.arrived.t)}</div><div class="big">✓ ${esc(short(al.name,60))}</div>
     <label>Notatka z tego miejsca</label><textarea rows="2" data-lid="${al.id}" data-f="note">${esc(al.note||'')}</textarea></div>
     ${url?`<a class="btn go" data-a="go" href="${url}" target="_blank" rel="noopener">Jedziemy dalej › ${esc(nm)}</a>
     <div class="mut" style="margin-top:6px">Otworzy Google Maps z trasą przez pozostałe miejsca${w.dest?' do celu':''}.</div>`
     :`<div class="card">Koniec trasy ✓</div><button class="s w" data-a="go">Zamknij</button>`}
     <button class="s w" style="margin-top:10px" data-a="undo">↩ Cofnij „Dotarłem”</button>`;
  }else if(c){
    main=`<div class="card now"><div class="mut">Następny cel · ${done.length+1} z ${w.locs.length}</div>
     <label>Trasa</label><textarea class="bigin" rows="2" data-lid="${c.id}" data-f="name" placeholder="Co to za miejsce, np. Stara fabryka, wejście od tyłu">${esc(c.name||'')}</textarea>
     ${linkRow(c)}
     <div class="row" style="margin-top:8px">${mapLinks(c)}</div>
     <button class="go" data-a="mark">Dotarłem</button>
     ${done.length?'<button class="s w" style="margin-top:8px" data-a="prev">← Poprzednie miejsce</button>':''}
     <a class="btn s w" style="margin-top:8px" href="${url}" target="_blank" rel="noopener">Nawiguj w Google Maps</a></div>`;
  }else{
    main=`<div class="card">${w.locs.length?'Wszystkie miejsca odwiedzone ✓':'Brak miejsc. Pobierz trasę z chmury.'}${w.dest?`<div class="mut" style="margin-top:6px">Cel podróży: ${esc(w.dest.name)}</div>`:''}</div>
     ${url?`<a class="btn go" href="${url}" target="_blank" rel="noopener">Jedź do celu</a>`:''}`;
  }
  $('#body').innerHTML=main+`
  ${todo.length>1?`<h2>Dalej (${todo.length-1})</h2>`+todo.slice(1).map((l,i)=>`<div class="card"><b>${done.length+i+2}.</b>${fields(l)}<div class="row">${mapLinks(l)}</div></div>`).join(''):''}
  <h2>Archiwum (${done.length})</h2>${done.map(l=>`<div class="card done"><b>✓ ${esc(short(l.name,60))}</b><div class="mut">${fmt(l.done)}</div>${l.note?`<div class="mut">${esc(l.note)}</div>`:''}<button class="s" style="margin-top:8px;min-height:40px" data-a="undoid" data-id="${l.id}">↩ Cofnij</button></div>`).join('')||'<div class="mut">Jeszcze nic.</div>'}
  <h2>Chmura</h2><div class="card"><button class="s w" data-a="pull">⬇ Pobierz trasę z chmury</button><div id="sy" class="mut" style="margin-top:8px"></div></div>
  <details><summary>Więcej opcji</summary><div class="card"><label>Promień wykrycia dojazdu (m)</label><input id="rad" type="number" inputmode="numeric" value="${S.rad||150}">
   <label>Dodaj miejsce (link, współrzędne lub nazwa)</label><textarea id="paste" rows="2"></textarea><button class="s w" data-a="add">+ Dodaj</button><div id="msg" class="mut" style="margin-top:6px"></div></div>
  <div class="card"><button class="s w" data-a="delw">Usuń tę wyprawę z telefonu</button><div class="mut" style="margin-top:6px">Usuwa też zdjęcia tej wyprawy zapisane w telefonie.</div></div></details>`;
}
async function viewF(w){
  $('#body').innerHTML=`<h2>Zdjęcia — ${w.date}</h2><label class="btn w" style="display:flex">📷 Dodaj zdjęcia<input id="pf" type="file" accept="image/*" multiple hidden></label>
  <div class="mut" style="margin:8px 0 12px">Zapisane w telefonie. Wysyłka na Dysk Google dojdzie w kolejnym etapie.</div><div class="grid" id="gr"></div>`;
  const ps=await photos(w.id),g=$('#gr');if(!g)return;
  if(!ps.length)g.outerHTML='<div class="mut">Brak zdjęć w tej wyprawie.</div>';
  ps.forEach(p=>{const im=document.createElement('img');im.src=URL.createObjectURL(p.blob);im.onclick=()=>viewer(p,im.src);g.appendChild(im)});
}
function viewer(p,src){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<img src="${src}"><div class="row"><button class="s" id="cl">Zamknij</button><button id="rm">Usuń</button></div>`;
  document.body.appendChild(o);$('#cl').onclick=()=>o.remove();
  $('#rm').onclick=()=>{if(confirm('Usunąć to zdjęcie?')){st('readwrite').delete(p.id).onsuccess=()=>{const w=W();w.pc=Math.max(0,(w.pc||1)-1);save();o.remove();viewF(w)}}};
}
function viewK(w){
  $('#body').innerHTML=`<h2>Dojazd i paliwo</h2><div class="card"><label>Auto</label><input id="car" value="${esc(w.car||'')}" placeholder="np. Golf 1.6 TDI">
  <div class="row"><div><label>Przejechane km</label><input id="km" type="number" step="any" inputmode="decimal" value="${w.km||''}"></div>
  <div><label>Zatankowane litry</label><input id="l" type="number" step="any" inputmode="decimal" value="${w.l||''}"></div></div>
  <label>Cena paliwa (zł/l)</label><input id="p" type="number" step="any" inputmode="decimal" value="${w.p||''}"></div>
  <div class="card"><div class="kv"><span>Koszt paliwa</span><span class="big" id="o1"></span></div>
  <div class="kv"><span>Realne spalanie</span><span class="big" id="o2"></span></div>
  <div class="kv"><span>Koszt na 1 km</span><b id="o3"></b></div></div>`;
  outK(w);
}
function outK(w){const s=stats(w);
  $('#o1').textContent=s.cost!==null?money(s.cost):'–';
  $('#o2').textContent=s.l100!==null?s.l100.toFixed(2)+' l/100 km':'–';
  $('#o3').textContent=s.ck!==null?money(s.ck):'–';}


/* ---------- plan trasy ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setMsg=t=>{const m=$('#msg');if(m)m.textContent=t};
const FAIL='Nie rozpoznano. Wklej pełny link z google.com/maps, współrzędne (np. 52.40, 16.92) albo nazwę miejscowości. Skrócone linki maps.app.goo.gl wymagają włączenia rozwijania linków (ekran główny, sekcja Ustawienia). Alternatywa: w Google Maps przytrzymaj punkt na mapie i skopiuj współrzędne z góry ekranu.';
async function expand(u){
  try{const j=await api('/expand?u='+encodeURIComponent(u));return j.url||null}catch(e){return null}
}
function nameFromUrl(u){try{const m=u.match(/\/maps\/place\/([^/@?]+)/);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''}catch(e){return ''}}
async function resolve(line){
  line=line.trim();let name='';
  if(line.includes('|')){const i=line.indexOf('|');name=line.slice(0,i).trim();line=line.slice(i+1).trim()}
  const c=parse(line);
  if(c)return{...c,name:name||c.lat.toFixed(4)+', '+c.lng.toFixed(4)};
  if(/^https?:\/\//i.test(line)){
    let u=line;
    if(/goo\.gl|g\.co\//.test(u)){u=await expand(u);if(!u)return null}
    const nm=nameFromUrl(u),c2=parse(u);
    if(c2)return{...c2,name:name||nm||c2.lat.toFixed(4)+', '+c2.lng.toFixed(4)};
    if(!nm)return null;line=nm;
  }
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(line));
    const j=await r.json();
    if(j[0])return{lat:+j[0].lat,lng:+j[0].lon,name:name||j[0].display_name.split(',').slice(0,2).join(',').trim(),geo:1}}catch(e){}
  return null;
}
async function setPoint(k,sel){
  const w=W(),v=$(sel).value.trim();if(!v)return;setMsg('Szukam…');
  const r=await resolve(v);
  if(!r){alert(FAIL);return}
  w[k]=r;w.routed=false;save();render();
}
function setStartGPS(){
  const w=W();if(!navigator.geolocation)return alert('Brak geolokalizacji.');
  navigator.geolocation.getCurrentPosition(p=>{w.start={lat:p.coords.latitude,lng:p.coords.longitude,name:'Moja lokalizacja',gps:1};w.routed=false;save();render()},
    e=>alert('Nie udało się pobrać lokalizacji: '+e.message),{enableHighAccuracy:true,timeout:10000});
}
async function addPlaces(){
  const w=W(),lines=$('#paste').value.split('\n').map(x=>x.trim()).filter(Boolean);let ok=0,bad=0;
  for(const l of lines){setMsg('Dodaję… ('+(ok+bad+1)+'/'+lines.length+')');
    const r=await resolve(l);
    if(r){w.locs.push({id:Date.now()+Math.random(),name:r.name,lat:r.lat,lng:r.lng,done:null});ok++}else bad++;
    if(r&&r.geo)await sleep(1100)}
  w.routed=false;save();render();
  if(bad)setMsg('Nie rozpoznano: '+bad+'. '+FAIL);
}
const hav=(a,b)=>dist(a.lat,a.lng,b.lat,b.lng);
async function orderRoute(w){
  let s=w.start;
  if(!s&&navigator.geolocation)s=await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:8000}));
  const done=w.locs.filter(l=>l.done);let pts=w.locs.filter(l=>!l.done);
  const path=[];if(s)path.push(s);if(w.dest)path.push(w.dest);
  const lo=s?1:0,tail=w.dest?1:0;
  while(pts.length){
    let best=null;
    for(const p of pts)for(let i=lo;i<=path.length-tail;i++){
      const a=path[i-1],b=path[i],inc=(a?hav(a,p):0)+(b?hav(p,b):0)-(a&&b?hav(a,b):0);
      if(!best||inc<best.inc)best={p,i,inc}}
    path.splice(best.i,0,best.p);pts=pts.filter(x=>x!==best.p);
  }
  let km=0;for(let i=1;i<path.length;i++)km+=hav(path[i-1],path[i]);
  w.locs=done.concat(path.slice(lo,path.length-tail));
  w.est=Math.round(km*1.3/1000);w.routed=true;save();
}
function legs(w){
  const stops=w.locs.filter(l=>!l.done).concat(w.dest?[w.dest]:[]);
  const av=[w.tolls!==false?'tolls':'',w.hw?'highways':''].filter(Boolean).join('%7C');
  const f=p=>p.lat+','+p.lng,out=[];let org=w.start&&!w.start.gps?w.start:null;
  for(let i=0;i<stops.length;i+=10){
    const ch=stops.slice(i,i+10),d=ch[ch.length-1],wp=ch.slice(0,-1);
    let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+f(d);
    if(org)u+='&origin='+f(org);
    if(wp.length)u+='&waypoints='+wp.map(f).join('%7C');
    if(av)u+='&avoid='+av;
    out.push({u,n:ch.length});org=d;
  }
  return out;
}


/* ---------- synchronizacja (Cloudflare Worker) ---------- */
const syncMsg=t=>{const m=$('#sy');if(m)m.textContent=t};
async function api(path,opt){
  if(!S.worker||!S.key)throw new Error('Uzupełnij adres Workera i hasło w Ustawieniach (ekran główny, na dole).');
  const r=await fetch((/^https?:\/\//i.test(S.worker)?S.worker:'https://'+S.worker).replace(/\/+$/,'')+path,Object.assign({},opt,{headers:{'X-Key':S.key,'Content-Type':'application/json'}}));
  if(r.status===401)throw new Error('Złe hasło dostępu.');
  if(!r.ok)throw new Error('Błąd Workera ('+r.status+').');
  return r.json();
}
async function push(w){
  syncMsg('Wysyłam…');
  try{
    w.cid=w.cid||String(w.id);
    await api('/trip',{method:'PUT',body:JSON.stringify({id:w.cid,name:w.name,date:w.date,start:w.start||null,dest:w.dest||null,locs:w.locs})});
    w.cloud=1;save();syncMsg('Wysłano o '+new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})+' ('+w.locs.length+' miejsc).');
  }catch(e){syncMsg(e.message)}
}
async function pull(){
  syncMsg('Pobieram…');
  try{
    const t=await api('/trip');if(!t)return syncMsg('W chmurze nie ma jeszcze trasy.');
    if(t.deleted){
      const lw=S.w.find(x=>x.cid===t.id);
      if(!lw)return syncMsg('W chmurze nie ma aktywnej trasy.');
      if(lw.pc>0)return syncMsg('Trasa „'+lw.name+'” została usunięta na komputerze, ale ma '+lw.pc+' zdjęć na tym telefonie, więc jej nie kasuję. Usuń ją ręcznie (Więcej opcji), gdy zdjęcia będą bezpieczne.');
      S.w=S.w.filter(x=>x!==lw);if(S.cur===lw.id)S.cur=null;save();render();
      return syncMsg('Trasa „'+lw.name+'” została usunięta na komputerze, więc usunięto ją też z telefonu.');
    }
    let w=S.w.find(x=>x.cid===t.id);
    if(!w){w={id:Date.now(),cid:t.id,locs:[],pc:0};S.w.push(w)}
    const dn=new Map(w.locs.filter(l=>l.done).map(l=>[l.id,l.done]));
    Object.assign(w,{name:t.name,date:t.date,start:t.start,dest:t.dest,cloud:1,routed:false});
    w.locs=(t.locs||[]).map(l=>Object.assign({},l,{done:l.done||dn.get(l.id)||null}));
    S.cur=w.id;S.tab='d';save();render();
  }catch(e){syncMsg(e.message)}
}

/* ---------- lokalizacje ---------- */
function parse(line){
  const pats=[/@(-?\d+\.\d+),(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|query|ll|destination|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/,/(-?\d{1,3}\.\d+)[,;\s]+(-?\d{1,3}\.\d+)/];
  for(const p of pats){const m=line.match(p);if(m)return{lat:+m[1],lng:+m[2]}}return null}
function arrive(w,l,auto){
  l.done=Date.now();w.arrived={id:l.id,t:l.done,auto:!!auto};save();
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(S.cur===w.id)render();
}
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
function stopTrack(){}

async function delPhotos(id){
  db=db||await openDB();if(!db)return;
  const ps=await photos(id);
  for(const p of ps)await new Promise(r=>{const q=st('readwrite').delete(p.id);q.onsuccess=r;q.onerror=r});
}
async function deleteTrip(w){
  const phone=!wide();
  if(!confirm(phone?'Usunąć tę wyprawę z telefonu razem ze zdjęciami?':'Usunąć tę wyprawę z tego urządzenia?'))return;
  if(!phone&&w.cid&&S.worker&&S.key&&confirm('Usunąć też z chmury? Telefon usunie ją przy najbliższym dotknięciu „Pobierz”.')){
    try{
      const t=await api('/trip');
      if(t&&t.id===w.cid&&!t.deleted)await api('/trip',{method:'PUT',body:JSON.stringify({id:w.cid,deleted:true,name:w.name,locs:[]})});
    }catch(e){alert('Nie udało się usunąć z chmury: '+e.message+' Wyprawa zostanie usunięta tylko tutaj.')}
  }
  if(phone)await delPhotos(w.id);
  S.w=S.w.filter(x=>x.id!==w.id);S.cur=null;save();render();
}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,w=W();
  if(a==='new'){const n=prompt('Nazwa wyprawy','Urbex');if(n===null)return;
    const x={id:Date.now(),name:n.trim()||'Urbex',date:today(),locs:[],pc:0};S.w.push(x);S.cur=x.id;S.tab='d';save();render()}
  else if(a==='open'){S.cur=+b.dataset.id;S.tab='d';save();render()}
  else if(a==='back'){stopTrack();S.cur=null;save();render()}
  else if(a==='tab'){S.tab=b.dataset.t;render()}
  else if(a==='mark'){const c=w.locs.find(l=>!l.done);if(c)arrive(w,c,false)}
  else if(a==='undo'||a==='prev'||a==='undoid'){
    let l;
    if(a==='undoid')l=w.locs.find(x=>String(x.id)===b.dataset.id);
    else if(a==='undo')l=w.arrived&&w.locs.find(x=>x.id===w.arrived.id);
    else l=w.locs.filter(x=>x.done).sort((p,q)=>q.done-p.done)[0];
    if(l){l.done=null;if(w.arrived&&w.arrived.id===l.id)w.arrived=null;save();render()}
  }
  else if(a==='go'){w.arrived=null;save();setTimeout(render,400)}
  else if(a==='dl'){w.locs=w.locs.filter(l=>String(l.id)!==b.dataset.id);w.routed=false;save();render()}
  else if(a==='delw')deleteTrip(w);
  else if(a==='push')push(w);
  else if(a==='pull')pull();
  else if(a==='wk'){let wk=$('#wk').value.trim().replace(/\/+$/,'');if(wk&&!/^https?:\/\//i.test(wk))wk='https://'+wk;S.worker=wk;S.key=$('#kk').value;save();alert('Zapisano')}
  else if(a==='add')addPlaces();
  else if(a==='sg')setStartGPS();
  else if(a==='ss')setPoint('start','#si');
  else if(a==='ds')setPoint('dest','#di');
  else if(a==='rt'){setMsg('');b.textContent='Układam…';orderRoute(w).then(render)}
});
document.addEventListener('input',e=>{
  const w=W(),i=e.target.id;if(!w)return;
  if(e.target.dataset.lid){const l=w.locs.find(x=>String(x.id)===e.target.dataset.lid);if(l){l[e.target.dataset.f]=e.target.value;save()}return}
  if(i==='rad'){S.rad=+e.target.value||150;save();return}
  if(['car','km','l','p'].includes(i)){w[i]=e.target.value;save();outK(w)}
  else if(i==='wn'){w.name=e.target.value||'Urbex';save()}
  else if(i==='wd'&&e.target.value){w.date=e.target.value;save()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='o-t'){W().tolls=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id==='o-h'){W().hw=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id!=='pf')return;
  const w=W();db=db||await openDB();if(!db){alert('Ta przeglądarka nie pozwala zapisać zdjęć.');return}
  for(const f of e.target.files){await new Promise(r=>{const q=st('readwrite').add({wid:w.id,name:f.name,t:Date.now(),blob:f});q.onsuccess=r;q.onerror=r});w.pc=(w.pc||0)+1}
  save();viewF(w);
});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const w=W();if(!w||wide()||S.tab!=='d')return;
  render();
  if(w.arrived||!navigator.geolocation)return;
  const c=w.locs.find(l=>!l.done);if(!c)return;
  navigator.geolocation.getCurrentPosition(p=>{
    if(dist(p.coords.latitude,p.coords.longitude,c.lat,c.lng)<=(S.rad||150)&&!w.arrived&&!c.done)arrive(w,c,true);
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
});
try{window.matchMedia('(min-width:900px)').addEventListener('change',render)}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
