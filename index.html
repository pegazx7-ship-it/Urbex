<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Urbex">
<meta name="theme-color" content="#F1F5F2">
<script>try{var t=localStorage.getItem("urbex_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Urbex</title>
<style>
:root{--bg:#F1F5F2;--card:#FFFFFF;--c2:#DDE7E3;--tx:#0E2A2B;--mut:#4F6D69;--ac:#2F6663;--btn:#0E2A2B;--on:#C6F432;--line:#0E2A2B;--bd:#D3E0DB;--mapbg:#0E2A2B;--cont:#1D4A48;--done:#7E9995;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0F1B1C;--card:#182A2B;--c2:#22393A;--tx:#E6EEEB;--mut:#8CA9A5;--ac:#C6F432;--btn:#C6F432;--on:#0A1415;--line:#C6F432;--bd:#1E3A3B;--mapbg:#070F10;--cont:#12292A;--done:#6F8A86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B1C;--card:#182A2B;--c2:#22393A;--tx:#E6EEEB;--mut:#8CA9A5;--ac:#C6F432;--btn:#C6F432;--on:#0A1415;--line:#C6F432;--bd:#1E3A3B;--mapbg:#070F10;--cont:#12292A;--done:#6F8A86;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Manrope,-apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 14px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;margin:0;font-weight:800}
h2{font-size:12px;margin:22px 0 8px;color:var(--ac);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--bd)}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
input[type=checkbox]{width:24px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:999px;min-height:48px;padding:10px 20px;background:var(--btn);color:var(--on);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button.s,.btn.s{background:var(--c2);color:var(--tx)}
.o{background:transparent!important;color:var(--line)!important;box-shadow:inset 0 0 0 1.5px var(--line)}
.w{width:100%}
.row.fr{align-items:flex-start}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sp{flex:1}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top .s{min-height:44px;padding:6px 16px;white-space:nowrap;flex:none}
.tt{font-size:17px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thm{width:44px;min-height:44px;padding:0!important;border-radius:50%!important;flex:none}
.bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;background:var(--bg);border-top:1px solid var(--bd);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bar button{flex:1;max-width:170px;background:none;color:var(--mut);min-height:48px;font-size:14px;gap:6px;padding:0 10px}
.bar button.on{background:var(--btn);color:var(--on)}
.syn:empty{display:none}.syn{margin:-6px 0 8px;font-size:12px}
.mapw{margin:0 -14px;background:var(--mapbg);padding-bottom:26px}
.mapw svg{display:block;width:100%;height:auto;max-height:380px}
.mapw.empty{padding:44px 24px 70px;text-align:center;color:#9DB8B3;font-weight:600}
.mp text{font:700 11px Manrope,-apple-system,system-ui,sans-serif;fill:#E6EEEB;stroke:var(--mapbg);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.mp .dn text{fill:var(--done)}
.mp .cont path{fill:none;stroke:var(--cont);stroke-width:1.5}
.mp .sg{fill:none;stroke:var(--done);stroke-width:2}
.mp .sa{fill:none;stroke:#C6F432;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 9}
.mp .dl{fill:#C6F432}.mp .dc{fill:#C6F432}.mp .rg{fill:none;stroke:#C6F432;stroke-opacity:.4;stroke-width:2}
.mp .dg{fill:var(--done)}.mp .ck{fill:none;stroke:var(--mapbg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mp .ds{fill:var(--mapbg);stroke:var(--done);stroke-width:2}.mp .dd{fill:#E6EEEB;stroke:#C6F432;stroke-width:2}
.mp g[data-a]{cursor:pointer}
.mapw .pinfo{padding:2px 18px 0;color:#9DB8B3;font-size:13px;min-height:22px}
.sheet{position:relative;margin:-26px -14px 0;padding:18px 14px 0;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.28)}
.kick{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ac);text-transform:uppercase}
.big{font-size:24px;font-weight:800}.mut{color:var(--mut);font-size:14px}
.now{border:2px solid var(--line)}.done{opacity:.75}.ok{border:2px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chip{flex:none;min-height:40px;padding:0 14px;font-size:13px;font-weight:700;background:var(--c2);color:var(--tx);border-radius:14px}
.bigin{font-size:22px;font-weight:800}
.go{min-height:56px;font-size:18px;margin-top:10px}
.hero{background:var(--mapbg);color:#E6EEEB;border-radius:0 0 28px 28px;margin:-10px -14px 8px;padding:20px 22px 24px}
.hero .mut{color:#9DB8B3}.herobig{font-size:54px;font-weight:800;line-height:1.05;color:#C6F432}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:#000e;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:9}
.ov img{flex:1;min-height:0;object-fit:contain;width:100%}
textarea{resize:vertical}
details>summary{cursor:pointer;padding:10px 0;color:var(--mut);font-weight:700}
a{color:var(--ac)}
.cols{display:block}
@media(min-width:900px){
 main{max-width:1100px;padding-bottom:40px}
 .cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
 .cols .mapw{margin:0;border-radius:20px;padding-bottom:16px}
 .hero{margin:0 0 12px;border-radius:20px}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=t=>new Date(t).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const money=v=>v.toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const gm=l=>'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng;
let S={w:[],cur:null,tab:'d'};
const wide=()=>window.matchMedia&&window.matchMedia('(min-width:900px)').matches;
try{Object.assign(S,JSON.parse(localStorage.getItem('urbex_v2')||'{}'))}catch(e){}
const save=()=>{try{S.w.forEach(stamp);localStorage.setItem('urbex_v2',JSON.stringify(S))}catch(e){}if(S.w.some(x=>x._dirty&&x.cid))scheduleSync()};
const W=()=>S.w.find(x=>x.id===S.cur);
let gpsMsg='Śledzenie wyłączone. Działa przy włączonym ekranie.',wid=null;

/* ---------- IndexedDB (zdjęcia) ---------- */
let db=null;
const openDB=()=>new Promise(res=>{try{const r=indexedDB.open('urbex_v2',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const st=m=>db.transaction('p',m).objectStore('p');
const photos=async id=>{db=db||await openDB();if(!db)return[];
  return new Promise(r=>{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result.filter(p=>p.wid===id));q.onerror=()=>r([])})};

/* ---------- widoki ---------- */
const num=v=>parseFloat(String(v==null?'':v).replace(',','.'))||0;
const fuelOf=w=>{if(!w.fuel){w.fuel=[];if(num(w.l)&&num(w.km)&&num(w.p))w.fuel.push({id:Date.now(),km:w.km,l:w.l,p:w.p,t:Date.now()})}return w.fuel};
function costs(w){
  let km=0,l=0,fc=0;
  fuelOf(w).forEach(x=>{km+=num(x.km);l+=num(x.l);fc+=num(x.l)*num(x.p)});
  const lod=num(w.lodging&&w.lodging.price),oth=num(w.other),np=parseInt(w.people)||0,n=Math.max(1,np),total=fc+lod+oth;
  return{km,l,fc,l100:km&&l?l/km*100:null,ck:km&&fc?fc/km:null,lod,oth,total,n,hasPeople:np>0,fpp:fc/n,tpp:total/n};
}
const fe=x=>{const l=num(x.l),k=num(x.km),p=num(x.p);return `<div class="kv"><span>Koszt tankowania</span><b>${l*p?money(l*p):'–'}</b></div><div class="kv"><span>Spalanie</span><b>${k&&l?(l/k*100).toFixed(2).replace('.',',')+' l/100 km':'–'}</b></div>`};
const lk=t=>{t=String(t||'').trim();return t?(/^https?:\/\//i.test(t)?t:'https://'+t):''};
const ICON={
 sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
 car:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14l2-6h14l2 6v4H3zM3 14h18"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>',
 cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 fuel:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M5 21h10M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3M7 9h6"/></svg>'
};
const curTheme=()=>document.documentElement.getAttribute('data-theme')||'light';
const themeBtn=()=>`<button class="s thm" data-a="theme" aria-label="Przełącz motyw jasny lub ciemny">${curTheme()==='dark'?ICON.sun:ICON.moon}</button>`;
const coordLike=t=>/^-?\d+(\.\d+)?\s*[,;]\s*-?\d+(\.\d+)?$/.test(String(t||'').trim());
const lab=(n,name,m=13)=>{let t=String(name||'').replace(/\s+/g,' ').trim();if(coordLike(t))t='';if(t.length>m)t=t.slice(0,m-1)+'…';return n?(n+(t?' · ':'')+t):t};
function mapSvg(w){
  const seq=[];
  if(w.start)seq.push({k:'s',id:'start',p:w.start,t:'Start',full:'Start: '+(w.start.name||'')});
  w.locs.forEach((l,i)=>seq.push({k:'l',id:String(l.id),p:l,done:!!l.done,t:lab(i+1,l.name),full:(i+1)+'. '+(l.name||'Bez opisu')}));
  if(w.dest)seq.push({k:'d',id:'dest',p:w.dest,t:lab(0,w.dest.name)||'Meta',full:'Cel: '+(w.dest.name||'')});
  if(!seq.length)return '<div class="mapw empty">Mapa pojawi się, gdy ustawisz start, cel lub dodasz miejsca.</div>';
  const W0=358,H0=270,P=42,lats=seq.map(s=>s.p.lat),lngs=seq.map(s=>s.p.lng);
  const kx=Math.cos(lats.reduce((a,b)=>a+b,0)/lats.length*Math.PI/180);
  const minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lngs),maxLo=Math.max(...lngs);
  const sx=Math.max((maxLo-minLo)*kx,1e-4),sy=Math.max(maxLa-minLa,1e-4);
  const sc=Math.min((W0-2*P)/sx,(H0-2*P)/sy),ox=(W0-sx*sc)/2,oy=(H0-sy*sc)/2;
  seq.forEach(s=>{s.x=ox+(s.p.lng-minLo)*kx*sc;s.y=oy+(maxLa-s.p.lat)*sc});
  const cur=seq.find(s=>s.k==='l'&&!s.done);
  let segs='';
  for(let i=1;i<seq.length;i++){const a=seq[i-1],b=seq[i],g=(b.k==='l'&&b.done)||b.k==='s';
    segs+=`<path class="${g?'sg':'sa'}" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${b.x.toFixed(1)} ${b.y.toFixed(1)}"/>`}
  const boxes=[],order=(cur?[cur]:[]).concat(seq.filter(s=>s!==cur));
  order.forEach(s=>{
    const w1=s.t.length*6.4+4,h=14,r=s===cur?24:11;
    const cand=[[s.x-w1/2,s.y-r-h],[s.x-w1/2,s.y+r],[s.x+r,s.y-h/2],[s.x-r-w1,s.y-h/2]];
    let pick=null,first=null;
    for(const q of cand){
      const x0=Math.max(3,Math.min(W0-3-w1,q[0])),y0=Math.max(2,Math.min(H0-h-2,q[1])),bx={x0,y0,x1:x0+w1,y1:y0+h};
      if(!first)first=bx;
      const hit=boxes.some(o=>bx.x0<o.x1&&bx.x1>o.x0&&bx.y0<o.y1&&bx.y1>o.y0)||seq.some(o=>o!==s&&o.x>bx.x0-8&&o.x<bx.x1+8&&o.y>bx.y0-8&&o.y<bx.y1+8);
      if(!hit){pick=bx;break}
    }
    pick=pick||first;boxes.push(pick);s.lx=pick.x0;s.ly=pick.y1-3;
  });
  const f=n=>n.toFixed(1);
  const dots=seq.slice().sort((a,b)=>(a===cur)-(b===cur)).map(s=>{
    let g;
    if(s.k==='s')g=`<circle cx="${f(s.x)}" cy="${f(s.y)}" r="6" class="ds"/>`;
    else if(s.k==='d')g=`<rect x="${f(s.x-7)}" y="${f(s.y-7)}" width="14" height="14" rx="3" class="dd"/>`;
    else if(s.done)g=`<circle cx="${f(s.x)}" cy="${f(s.y)}" r="8" class="dg"/><path class="ck" d="M${f(s.x-3.5)} ${f(s.y)}l2.5 2.5l4.5-5"/>`;
    else if(s===cur)g=`<circle cx="${f(s.x)}" cy="${f(s.y)}" r="21" class="rg"/><circle cx="${f(s.x)}" cy="${f(s.y)}" r="12" class="dc"/>`;
    else g=`<circle cx="${f(s.x)}" cy="${f(s.y)}" r="8" class="dl"/>`;
    return `<g data-a="pin" data-id="${s.id}" class="${s.done?'dn':''}"><title>${esc(s.full)}</title><circle cx="${f(s.x)}" cy="${f(s.y)}" r="20" fill="transparent"/>${g}<text x="${f(s.lx)}" y="${f(s.ly)}">${esc(s.t)}</text></g>`;
  }).join('');
  const cont='<g class="cont"><path d="M-10 60C60 20 120 100 200 70S320 10 380 50"/><path d="M-10 120C70 80 130 160 210 130S320 70 380 110"/><path d="M-10 180C80 140 140 220 220 190S320 130 380 170"/><path d="M-10 240C90 200 150 280 230 250S320 190 380 230"/></g>';
  const left=seq.filter(s=>s.k==='l'&&!s.done).length;
  return `<div class="mapw"><svg class="mp" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Schemat trasy, do odwiedzenia: ${left}">${cont}${segs}${dots}</svg><div id="pinfo" class="pinfo">Zielone: jeszcze nie byłeś. Szare: odwiedzone. Dotknij kropki, aby zobaczyć nazwę.</div></div>`;
}
const topBar=(w)=>`<div class="top"><button class="s" data-a="back">‹ Wyprawy</button><span class="tt">${esc(w.name)}</span><span class="sp"></span>${themeBtn()}</div><div id="syn" class="mut syn">${esc(synTxt)}</div>`;
function render(){
  pend=0;const w=W(),app=$('#app');
  if(!w){
    app.innerHTML=`<div class="top"><h1>Urbex</h1><span class="sp"></span>${themeBtn()}</div><button class="w" data-a="new">+ Nowa wyprawa</button><button class="s w" data-a="pull" style="margin-top:8px">Odśwież listę z chmury</button><div id="sy" class="mut" style="margin-top:6px">${esc(synTxt)}</div>${cloudList.length?`<h2>W chmurze (nie pobrane)</h2>`+cloudList.map(t=>`<div class="card"><b>${esc(t.name||'Wyprawa')}</b> <span class="mut">${esc(t.date||'')}</span><button class="w" style="margin-top:10px" data-a="dlc" data-id="${esc(t.id)}">Pobierz na to urządzenie</button></div>`).join(''):''}<h2>Wyprawy</h2>`+
    ([...S.w].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{
      const s=costs(x),v=x.locs.filter(l=>l.done).length;
      return `<div class="card" data-a="open" data-id="${x.id}"><b>${esc(x.name)}</b> <span class="mut">${x.date}</span>
      <div class="mut">${v}/${x.locs.length} miejsc · ${x.pc||0} zdjęć${s.total>0?' · '+money(s.total)+(s.hasPeople?' ('+money(s.tpp)+'/os.)':''):''}${s.l100!==null?' · '+s.l100.toFixed(1)+' l/100':''}</div></div>`}).join('')
      ||'<div class="mut">Jeszcze nie masz żadnej wyprawy. Dotknij przycisku powyżej.</div>')+`<h2>Ustawienia</h2><div class="card"><label>Adres Workera (Cloudflare)</label><input id="wk" value="${esc(S.worker||'')}" placeholder="https://urbex.TWOJA-NAZWA.workers.dev" autocapitalize="off"><label>Hasło dostępu</label><input id="kk" type="password" value="${esc(S.key||'')}" autocomplete="off"><button class="s w" data-a="wk">Zapisz</button></div>`;
    return;
  }
  if(S.tab==='m')S.tab='d';
  if(wide()){
    app.innerHTML=topBar(w)+`<div id="body"></div>`;
    viewPlan(w);return;
  }
  const tabs=[['d',ICON.car,'Trasa'],['k',ICON.fuel,'Koszty'],['f',ICON.cam,'Zdjęcia']];
  app.innerHTML=topBar(w)+`<div id="body"></div>
  <div class="bar">${tabs.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}${t[2]}</button>`).join('')}</div>`;
  ({d:viewDrive,f:viewF,k:viewK})[S.tab](w);
}
const short=(t,n=40)=>{t=String(t||'').replace(/\s+/g,' ').trim();return t?(t.length>n?t.slice(0,n)+'…':t):'Bez opisu'};
const pt=p=>p?`<b>${esc(p.name)}</b> <span class="mut">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>`:'<span class="mut">nie ustawiono</span>';
const linkRow=l=>`<label>Link</label><div style="margin:4px 0 10px"><a href="${gm(l)}" target="_blank" rel="noopener" style="color:var(--ac);word-break:break-all">${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} ↗</a></div>`;
const fields=l=>`<label>Trasa</label><textarea rows="2" data-lid="${l.id}" data-f="name" placeholder="Co to za miejsce, np. Stara fabryka, wejście od tyłu">${esc(l.name||'')}</textarea>${linkRow(l)}`;
const mapLinks=l=>`<a class="btn s" href="https://www.google.com/maps/@?api=1&map_action=map&center=${l.lat},${l.lng}&zoom=18&basemap=satellite" target="_blank" rel="noopener">Satelita</a>`;
function nextUrl(w){
  const stops=w.locs.filter(l=>!l.done).concat(w.dest?[w.dest]:[]);
  if(!stops.length)return null;
  const av=[w.tolls!==false?'tolls':'',w.hw?'highways':''].filter(Boolean).join('%7C');

  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+f(d);

    if(j[0])return{lat:+j[0].lat,lng:+j[0].lon,name:j[0].display_name.split(',').slice(0,2).join(',').trim(),geo:1}}catch(e){failed++}

function nameFromUrl(u){try{const m=u.match(/\/maps\/place\/([^/@?]+)/);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''}catch(e){return ''}}
async function resolve(line){
  line=line.trim();let name='';
  if(line.includes('|')){const i=line.indexOf('|');name=line.slice(0,i).trim();line=line.slice(i+1).trim()}
  const c=parse(line);
  if(c)return{...c,name:name||c.lat.toFixed(4)+', '+c.lng.toFixed(4)};
  if(/^https?:\/\//i.test(line)){
    let u=line;
    if(/goo\.gl|g\.co\//.test(u)){u=await expand(u);if(!u)return null}
    const nm=nameFromUrl(u),c2=parse(u);
    if(c2)return{...c2,name:name||nm||c2.lat.toFixed(4)+', '+c2.lng.toFixed(4)};
    if(!nm)return null;line=nm;
  }
  const g=await geocode(line);
  return g?{...g,name:name||g.name}:null;
}

const hav=(a,b)=>dist(a.lat,a.lng,b.lat,b.lng);
async function orderRoute(w){
  let s=w.start;
  if(!s&&navigator.geolocation)s=await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:8000}));
  const done=w.locs.filter(l=>l.done);let pts=w.locs.filter(l=>!l.done);
  const path=[];if(s)path.push(s);if(w.dest)path.push(w.dest);
  const lo=s?1:0,tail=w.dest?1:0;
  while(pts.length){
    let best=null;
    for(const p of pts)for(let i=lo;i<=path.length-tail;i++){
      const a=path[i-1],b=path[i],inc=(a?hav(a,p):0)+(b?hav(p,b):0)-(a&&b?hav(a,b):0);
      if(!best||inc<best.inc)best={p,i,inc}}
    path.splice(best.i,0,best.p);pts=pts.filter(x=>x!==best.p);
  }
  let km=0;for(let i=1;i<path.length;i++)km+=hav(path[i-1],path[i]);
  w.locs=done.concat(path.slice(lo,path.length-tail));
  w.est=Math.round(km*1.3/1000);w.routed=true;save();
}
function legs(w){
  const stops=w.locs.filter(l=>!l.done).concat(w.dest?[w.dest]:[]);
  const av=[w.tolls!==false?'tolls':'',w.hw?'highways':''].filter(Boolean).join('%7C');
  const f=p=>p.lat+','+p.lng,out=[];let org=w.start&&!w.start.gps?w.start:null;
  for(let i=0;i<stops.length;i+=10){
    const ch=stops.slice(i,i+10),d=ch[ch.length-1],wp=ch.slice(0,-1);
    let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+f(d);
    if(org)u+='&origin='+f(org);
    if(wp.length)u+='&waypoints='+wp.map(f).join('%7C');
    if(av)u+='&avoid='+av;
    out.push({u,n:ch.length});org=d;
  }
  return out;
}

function mergeEnt(a,b){

  const o={f:{},t:{}},ta=a.t||{},tb=b.t||{},fa=a.f||{},fb=b.f||{};
  for(const k of new Set([...Object.keys(ta),...Object.keys(tb)])){
    const x=ta[k]||0,y=tb[k]||0;
    const pickB=y>x||(y===x&&canon(fb[k])>canon(fa[k]));

  }

}
function mergeMap(a,b){

function norm(w,noFix){
  if(!noFix)fixOrd(w);
  const lo=w.lodging||{};
  const m={name:nv(w.name),date:nv(w.date),start:nv(w.start),dest:nv(w.dest),car:nv(w.car),people:nv(w.people),lodN:nv(lo.name),lodP:nv(lo.price),lodL:nv(lo.link),other:nv(w.other),tolls:w.tolls!==false,hw:!!w.hw};
  const L={},F={};
  w.locs.forEach(l=>{L[l.id]={name:nv(l.name),lat:nv(l.lat),lng:nv(l.lng),note:nv(l.note),done:l.done||null,ord:nv(l.ord)}});
  fuelOf(w).forEach(x=>{F[x.id]={km:nv(x.km),l:nv(x.l),p:nv(x.p),t:nv(x.t)}});
  return{m,L,F};
}
function stamp(w){
  const n=norm(w),now=Date.now(),t=w._t=w._t||{m:{},l:{},f:{},dl:{},df:{}},v=w._v||{m:{},L:{},F:{}};let ch=false;
  META.forEach(f=>{if(J(n.m[f])!==J(v.m[f])){t.m[f]=now;ch=true}});
  for(const [kind,fl,tk,dk] of [['L',LOCF,'l','dl'],['F',FUELF,'f','df']]){
    const old=v[kind]||{};
    for(const id in n[kind]){const o=n[kind][id],p=old[id];
      for(const f of fl)if(!p||J(o[f])!==J(p[f])){(t[tk][id]=t[tk][id]||{})[f]=now;ch=true}}
    for(const id in old)if(!n[kind][id]&&!t[dk][id]){t[dk][id]=now;ch=true}
  }
  w._v=n;if(ch){w._dirty=1;w._dv=(w._dv||0)+1}
}
function docOf(w){
  stamp(w);const n=w._v,t=w._t,d={id:w.cid,v:2,meta:{f:{...n.m},t:{...t.m}},locs:{},fuel:{}};
  for(const id in n.L)d.locs[id]={f:{...n.L[id]},t:{...(t.l[id]||{})}};
  for(const id in t.dl)d.locs[id]={d:t.dl[id]};
  for(const id in n.F)d.fuel[id]={f:{...n.F[id]},t:{...(t.f[id]||{})}};
  for(const id in t.df)d.fuel[id]={d:t.df[id]};
  if(w.delAt)d.deleted=w.delAt;
  return d;
}
function setM(w,f,v){
  if(f==='lodN'||f==='lodP'||f==='lodL'){w.lodging=w.lodging||{};w.lodging[{lodN:'name',lodP:'price',lodL:'link'}[f]]=v==null?'':v}
  else if(f==='tolls')w.tolls=v!==false;
  else if(f==='hw')w.hw=!!v;
  else if(v==null&&(f==='name'||f==='date'))return;
  else w[f]=(v==null&&(f==='car'||f==='people'||f==='other'))?'':v;
}
function applyDoc(w,r){
  stamp(w);
  const before=canon(w._v),merged=mergeDoc(docOf(w),r),M=merged.meta,t=w._t={m:{...M.t},l:{},f:{},dl:{},df:{}};
  META.forEach(f=>{if(M.f&&f in M.f)setM(w,f,M.f[f])});
  const lm=new Map(w.locs.map(l=>[String(l.id),l])),lo=[];
  for(const k in merged.locs){const e=merged.locs[k];
    if(e.d){t.dl[k]=e.d;continue}
    const l=lm.get(k)||{id:Number(k)};LOCF.forEach(f=>{if(f in e.f)l[f]=e.f[f]});t.l[k]={...e.t};lo.push(l)}
  lo.sort((a,b)=>(a.ord-b.ord)||(a.id-b.id));w.locs=lo;
  const fm=new Map(fuelOf(w).map(x=>[String(x.id),x])),fo=[];
  for(const k in merged.fuel){const e=merged.fuel[k];
    if(e.d){t.df[k]=e.d;continue}
    const x=fm.get(k)||{id:Number(k)};FUELF.forEach(f=>{if(f in e.f)x[f]=e.f[f]});t.f[k]={...e.t};fo.push(x)}
  fo.sort((a,b)=>a.id-b.id);w.fuel=fo;
  w._v=norm(w,true);
  return{changed:before!==canon(w._v),push:canon(stripU(merged))!==canon(stripU(r))};
}
const hhmm=()=>new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
function setSyn(t){synTxt=t;['#syn','#sy'].forEach(q=>{const e=$(q);if(e)e.textContent=t})}
const syncMsg=setSyn;
async function api(path,opt){
  if(!S.worker||!S.key)throw new Error('Uzupełnij adres Workera i hasło w Ustawieniach (ekran główny, na dole).');
  const r=await fetch((/^https?:\/\//i.test(S.worker)?S.worker:'https://'+S.worker).replace(/\/+$/,'')+path,Object.assign({},opt,{headers:{'X-Key':S.key,'Content-Type':'application/json'}}));
  if(r.status===401)throw new Error('Złe hasło dostępu.');
  if(!r.ok)throw new Error('Błąd Workera ('+r.status+').');
  return r.json();
}
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(()=>{const w=W();if(w)syncTrip(w)},3000)}
function renderKeep(){
  const keep={};['fk','fl','fp','paste','si','di'].forEach(i=>{const e=document.getElementById(i);if(e&&e.value)keep[i]=e.value});
  render();for(const i in keep){const e=document.getElementById(i);if(e)e.value=keep[i]}
}
function softRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){pend=1;return}renderKeep()}
async function syncTrip(w,loud){
  if(!w||!w.cid||!S.worker||!S.key){if(loud)setSyn('Uzupełnij adres Workera i hasło w Ustawieniach (ekran główny, na dole).');return}
  if(syncing)return;syncing=1;
  try{
    for(let round=0;round<3;round++){
      stamp(w);const ver=w._dv||0;let r;
      if(w._pull){r=await api('/sync/'+w.cid)}
      else if(w._dirty||!w.srv){r=await api('/sync/'+w.cid,{method:'POST',body:JSON.stringify(docOf(w))})}
      else{r=await api('/sync/'+w.cid+'?since='+w.srv);if(r.same){setSyn('Zsynchronizowano '+hhmm());break}}
      if(r.none){w._pull=0;w._dirty=1;continue}
      if(r.deleted){remoteDeleted(w);return}
      const wasPull=w._pull;w._pull=0;
      const res=applyDoc(w,r);w.srv=r.updated;
      if(!wasPull&&(w._dv||0)===ver)w._dirty=0;
      if(res.push)w._dirty=1;
      if(res.changed&&S.cur===w.id)softRender();
      if(!w._dirty){setSyn('Zsynchronizowano '+hhmm());break}
    }
    save();
  }catch(e){setSyn((navigator.onLine===false?'Brak internetu. ':'')+'Zmiany czekają w telefonie. '+e.message)}
  finally{syncing=0}
}
function remoteDeleted(w){
  if(w.pc>0){setSyn('Wyprawa „'+w.name+'” została usunięta w chmurze, ale ma '+w.pc+' zdjęć na tym telefonie, więc jej nie kasuję. Usuń ją ręcznie (Więcej opcji), gdy zdjęcia będą bezpieczne.');w.cid=null;save();return}
  S.w=S.w.filter(x=>x!==w);if(S.cur===w.id)S.cur=null;save();render();
  setSyn('Wyprawa „'+w.name+'” została usunięta w chmurze, więc usunięto ją też z tego urządzenia.');
}
async function listCloud(){
  setSyn('Pobieram listę wypraw…');
  try{const r=await api('/trips');cloudList=r.filter(t=>!S.w.some(x=>x.cid===t.id));render();setSyn(cloudList.length?'':'Nie ma nowych wypraw w chmurze.')}
  catch(e){setSyn(e.message)}
}

/* ---------- lokalizacje ---------- */
function parse(line){
  const pats=[/@(-?\d+\.\d+),(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|query|ll|destination|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/,/(-?\d{1,3}\.\d+)[,;\s]+(-?\d{1,3}\.\d+)/];
  for(const p of pats){const m=line.match(p);if(m)return{lat:+m[1],lng:+m[2]}}return null}
function arrive(w,l,auto){
  l.done=Date.now();w.arrived={id:l.id,t:l.done,auto:!!auto};save();
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(S.cur===w.id)render();
}
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
function stopTrack(){}

async function delPhotos(id){
  db=db||await openDB();if(!db)return;
  const ps=await photos(id);
  for(const p of ps)await new Promise(r=>{const q=st('readwrite').delete(p.id);q.onsuccess=r;q.onerror=r});
}
async function deleteTrip(w){
  const phone=!wide();
  if(!confirm(phone?'Usunąć tę wyprawę z telefonu razem ze zdjęciami?':'Usunąć tę wyprawę z tego urządzenia?'))return;
  if(!phone&&w.cid&&S.worker&&S.key&&confirm('Usunąć też z chmury? Pozostałe urządzenia usuną ją przy najbliższej synchronizacji.')){
    try{
      stamp(w);const d=docOf(w);d.deleted=Date.now();
      await api('/sync/'+w.cid,{method:'POST',body:JSON.stringify(d)});
    }catch(e){alert('Nie udało się usunąć z chmury: '+e.message+' Wyprawa zostanie usunięta tylko tutaj.')}
  }
  if(phone)await delPhotos(w.id);
  S.w=S.w.filter(x=>x.id!==w.id);S.cur=null;save();render();
}

function setTheme(t,persist){
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#0F1B1C':'#F1F5F2';
  document.querySelectorAll('.thm').forEach(b=>{b.innerHTML=t==='dark'?ICON.sun:ICON.moon});
  if(persist)try{localStorage.setItem('urbex_theme',t)}catch(e){}
}
{const cur=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 setTheme(cur,false)}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,w=W();
  if(a==='new'){const n=prompt('Nazwa wyprawy','Urbex');if(n===null)return;
    const x={id:Date.now(),name:n.trim()||'Urbex',date:today(),locs:[],pc:0};S.w.push(x);S.cur=x.id;S.tab='d';save();render()}
  else if(a==='open'){S.cur=+b.dataset.id;S.tab='d';save();render();const ow=W();if(ow&&ow.cid)syncTrip(ow)}
  else if(a==='back'){stopTrack();if(w&&w.cid)syncTrip(w);S.cur=null;save();render()}
  else if(a==='tab'){S.tab=b.dataset.t;render()}
  else if(a==='theme')setTheme(curTheme()==='dark'?'light':'dark',true);
  else if(a==='pin'){const el=$('#pinfo');if(!el||!w)return;const id=b.getAttribute('data-id');let t;
    if(id==='start')t='Start: '+((w.start&&w.start.name)||'');
    else if(id==='dest')t='Cel: '+((w.dest&&w.dest.name)||'');
    else{const i=w.locs.findIndex(x=>String(x.id)===id),l=w.locs[i];if(!l)return;t=(i+1)+'. '+(l.name||'Bez opisu')+(l.done?' · odwiedzone '+fmt(l.done):'')}
    el.textContent=t}
  else if(a==='mark'){const c=w.locs.find(l=>!l.done);if(c)arrive(w,c,false)}
  else if(a==='undo'||a==='prev'||a==='undoid'){
    let l;
    if(a==='undoid')l=w.locs.find(x=>String(x.id)===b.dataset.id);
    else if(a==='undo')l=w.arrived&&w.locs.find(x=>x.id===w.arrived.id);
    else l=w.locs.filter(x=>x.done).sort((p,q)=>q.done-p.done)[0];
    if(l){l.done=null;if(w.arrived&&w.arrived.id===l.id)w.arrived=null;save();render()}
  }
  else if(a==='addfuel'){
    const k=num($('#fk').value),l=num($('#fl').value),p=num($('#fp').value),m=$('#fm');
    if(!(k>0&&l>0&&p>0)){m.textContent='Wpisz kilometry, litry i cenę (wszystkie większe od zera).';return}
    fuelOf(w).push({id:Date.now(),km:$('#fk').value.trim(),l:$('#fl').value.trim(),p:$('#fp').value.trim(),t:Date.now()});save();viewK(w);
  }
  else if(a==='delfuel'){if(confirm('Usunąć to tankowanie?')){w.fuel=fuelOf(w).filter(x=>String(x.id)!==b.dataset.id);save();viewK(w)}}
  else if(a==='go'){w.arrived=null;save();setTimeout(render,400)}
  else if(a==='dl'){w.locs=w.locs.filter(l=>String(l.id)!==b.dataset.id);w.routed=false;save();render()}
  else if(a==='delw')deleteTrip(w);
  else if(a==='push'){if(!S.worker||!S.key){setSyn('Uzupełnij adres Workera i hasło w Ustawieniach (ekran główny, na dole).');return}
    if(!w.cid)w.cid=String(Date.now());w._dirty=1;save();syncTrip(w,true)}
  else if(a==='pull')listCloud();
  else if(a==='dlc'){const id=b.dataset.id,t=cloudList.find(x=>x.id===id);
    const nw={id:Date.now(),cid:id,name:(t&&t.name)||'Urbex',date:(t&&t.date)||today(),locs:[],pc:0};
    nw._t={m:{},l:{},f:{},dl:{},df:{}};nw._v=norm(nw,true);nw._pull=1;
    S.w.push(nw);S.cur=nw.id;S.tab='d';cloudList=cloudList.filter(x=>x.id!==id);save();render();syncTrip(nw,true)}
  else if(a==='wk'){let wk=$('#wk').value.trim().replace(/\/+$/,'');if(wk&&!/^https?:\/\//i.test(wk))wk='https://'+wk;S.worker=wk;S.key=$('#kk').value;save();alert('Zapisano')}
  else if(a==='add')addPlaces();
  else if(a==='sg')setStartGPS();
  else if(a==='ss')setPoint('start','#si');
  else if(a==='ds')setPoint('dest','#di');
  else if(a==='rt'){setMsg('');b.textContent='Układam…';orderRoute(w).then(render)}
});
document.addEventListener('input',e=>{
  const w=W(),i=e.target.id;if(!w)return;
  if(e.target.dataset.lid){const l=w.locs.find(x=>String(x.id)===e.target.dataset.lid);if(l){l[e.target.dataset.f]=e.target.value;save()}return}
  if(i==='rad'){S.rad=+e.target.value||150;save();return}
  if(e.target.dataset.fid){const x=fuelOf(w).find(y=>String(y.id)===e.target.dataset.fid);if(x){x[e.target.dataset.ff]=e.target.value;save();outK(w);const el=$('#fe'+x.id);if(el)el.innerHTML=fe(x)}}
  else if(i==='car'){w.car=e.target.value;save()}
  else if(i==='ppl'){w.people=e.target.value;save();outK(w)}
  else if(i==='ln'||i==='lp'||i==='ll'){w.lodging=w.lodging||{};w.lodging[{ln:'name',lp:'price',ll:'link'}[i]]=e.target.value;save();outK(w);
    if(i==='ll'){const a=$('#lnk'),u=lk(e.target.value);if(a){a.href=u||'#';a.hidden=!u}}}
  else if(i==='ot'){w.other=e.target.value;save();outK(w)}
  else if(i==='wn'){w.name=e.target.value||'Urbex';save()}
  else if(i==='wd'&&e.target.value){w.date=e.target.value;save()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='o-t'){W().tolls=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id==='o-h'){W().hw=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id!=='pf')return;
  const w=W();db=db||await openDB();if(!db){alert('Ta przeglądarka nie pozwala zapisać zdjęć.');return}
  for(const f of e.target.files){await new Promise(r=>{const q=st('readwrite').add({wid:w.id,name:f.name,t:Date.now(),blob:f});q.onsuccess=r;q.onerror=r});w.pc=(w.pc||0)+1}
  save();viewF(w);
});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const w=W();if(!w||wide()||S.tab!=='d')return;
  render();
  if(w.arrived||!navigator.geolocation)return;
  const c=w.locs.find(l=>!l.done);if(!c)return;
  navigator.geolocation.getCurrentPosition(p=>{
    if(dist(p.coords.latitude,p.coords.longitude,c.lat,c.lng)<=(S.rad||150)&&!w.arrived&&!c.done)arrive(w,c,true);
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
});
try{window.matchMedia('(min-width:900px)').addEventListener('change',render)}catch(e){}
document.addEventListener('focusout',()=>{if(pend){setTimeout(()=>{if(pend&&!(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)))renderKeep()},700)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const w=W();if(w&&w.cid)syncTrip(w)}});
setInterval(()=>{if(document.visibilityState==='visible'){const w=W();if(w&&w.cid)syncTrip(w)}},15000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
S.w.forEach(fuelOf);save();
render();
</script>
