<style>

.fin-ring path{fill:none;stroke:#C6F432;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:finDraw .5s 1s ease-out forwards}

@keyframes finIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes finFall{to{transform:translateY(110vh) rotate(540deg)}}

.ph{position:relative;aspect-ratio:1;background:var(--c2);border-radius:12px;overflow:hidden}.ph img{display:block;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;font-size:0;color:transparent;border-radius:0}

<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=t=>new Date(t).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const money=v=>v.toLocaleString('pl-PL',{style:'currency',currency:'PLN'});
const gm=l=>'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng;
let S={w:[],cur:null,tab:'d'};
const wide=()=>window.matchMedia&&window.matchMedia('(min-width:900px)').matches;
try{Object.assign(S,JSON.parse(localStorage.getItem('urbex_v2')||'{}'))}catch(e){}
const save=()=>{try{S.w.forEach(stamp);localStorage.setItem('urbex_v2',JSON.stringify(S))}catch(e){}if(S.w.some(x=>x._dirty&&x.cid))scheduleSync()};
const W=()=>S.w.find(x=>x.id===S.cur);
let gpsMsg='Śledzenie wyłączone. Działa przy włączonym ekranie.',wid=null;

/* ---------- IndexedDB (zdjęcia) ---------- */
let db=null;
const openDB=()=>new Promise(res=>{try{const r=indexedDB.open('urbex_v2',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('t'))d.createObjectStore('t',{keyPath:'fid'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const st=m=>db.transaction('p',m).objectStore('p');
const photos=async id=>{db=db||await openDB();if(!db)return[];
  return new Promise(r=>{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result.filter(p=>p.wid===id));q.onerror=()=>r([])})};

/* ---------- widoki ---------- */
const num=v=>parseFloat(String(v==null?'':v).replace(',','.'))||0;
const fuelOf=w=>{if(!w.fuel){w.fuel=[];if(num(w.l)&&num(w.km)&&num(w.p))w.fuel.push({id:Date.now(),km:w.km,l:w.l,p:w.p,t:Date.now()})}return w.fuel};
function kmList(w){
  let prev=num(w.odo0)>0?num(w.odo0):null;
  return fuelOf(w).map(x=>{
    const o=num(x.odo);
    if(o>0){let km=null,bad=false;if(prev!=null){if(o>prev){km=o-prev;prev=o}else bad=true}else prev=o;return{km,bad}}
    return{km:num(x.km)>0?num(x.km):null,bad:false};
  });
}
function costs(w){
  const fl=fuelOf(w),kl=kmList(w);let kmK=0,lK=0,l=0,fc=0,lastO=0;
  fl.forEach((x,i)=>{l+=num(x.l);fc+=num(x.l)*num(x.p);const k=kl[i].km;if(k){kmK+=k;lK+=num(x.l)}if(num(x.odo)>lastO)lastO=num(x.odo)});
  const o0=num(w.odo0),o1=num(w.odo1);let km=kmK;
  if(o0>0){if(o1>o0)km=o1-o0;else if(lastO>o0)km=lastO-o0}
  const lod=num(w.lodging&&w.lodging.price),oth=(w.exp||[]).reduce((a,e)=>a+num(e.amt),0)+num(w.other);
  const np=(w.names&&w.names.length)||parseInt(w.people)||0,n=Math.max(1,np),total=fc+lod+oth;
  return{km,kmK,l,fc,l100:kmK&&lK?lK/kmK*100:null,lod,oth,total,n,hasPeople:np>0,fpp:fc/n,tpp:total/n};
}
const fe=(x,k)=>{const l=num(x.l),p=num(x.p);k=k||{};return `<div class="kv"><span>Koszt tankowania</span><b>${l*p?money(l*p):'–'}</b></div><div class="kv"><span>Spalanie</span><b>${k.km&&l?(l/k.km*100).toFixed(2).replace('.',',')+' l/100 km':'–'}</b></div><div class="kv"><span>Przejechane kilometry</span><b>${k.km?Math.round(k.km)+' km':(k.bad?'przebieg niższy niż poprzedni':'–')}</b></div>`};
function migrate(w){
  fuelOf(w);w.exp=w.exp||[];w.pics=w.pics||[];
  if(num(w.other)>0&&!w.exp.some(e=>e.id===1)){w.exp.push({id:1,desc:'Inne koszty',amt:String(w.other),who:null});w.other=''}
  if(!w.names&&parseInt(w.people)>0)w.names=Array.from({length:Math.min(12,parseInt(w.people))},(_,i)=>({i:'p'+(i+1),n:'Osoba '+(i+1)}));
}
function settle(w){
  const names=w.names||[],paid={},nm={};names.forEach(p=>{paid[p.i]=0;nm[p.i]=p.n});let un=0;
  const add=(who,amt)=>{if(!(amt>0))return;if(who&&who in paid)paid[who]+=amt;else un+=amt};
  fuelOf(w).forEach(x=>add(x.who,num(x.l)*num(x.p)));
  add(w.lodW,num(w.lodging&&w.lodging.price));
  (w.exp||[]).forEach(e=>add(e.who,num(e.amt)));
  const A=names.reduce((a,p)=>a+paid[p.i],0),n=names.length||1,share=A/n;
  const bal=names.map(p=>({i:p.i,n:p.n,paid:paid[p.i],bal:Math.round((paid[p.i]-share)*100)/100}));
  const deb=bal.filter(x=>x.bal<-0.004).map(x=>({n:x.n,r:Math.round(-x.bal*100)})).sort((a,b)=>b.r-a.r);
  const cre=bal.filter(x=>x.bal>0.004).map(x=>({n:x.n,r:Math.round(x.bal*100)})).sort((a,b)=>b.r-a.r);
  const transfers=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){const t=Math.min(deb[i].r,cre[j].r);if(t>0)transfers.push({from:deb[i].n,to:cre[j].n,amt:t/100});deb[i].r-=t;cre[j].r-=t;if(deb[i].r<=0)i++;if(cre[j].r<=0)j++}
  return{bal,share,transfers,un,A};
}
const lk=t=>{t=String(t||'').trim();return t?(/^https?:\/\//i.test(t)?t:'https://'+t):''};
const ICON={
 sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
 car:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14l2-6h14l2 6v4H3zM3 14h18"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>',
 cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 fuel:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M5 21h10M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3M7 9h6"/></svg>'
};
const curTheme=()=>document.documentElement.getAttribute('data-theme')||'light';
const themeBtn=()=>`<button class="s thm" data-a="theme" aria-label="Przełącz motyw jasny lub ciemny">${curTheme()==='dark'?ICON.sun:ICON.moon}</button>`;
const coordLike=t=>/^-?\d+(\.\d+)?\s*[,;]\s*-?\d+(\.\d+)?$/.test(String(t||'').trim());
const lab=(n,name,m=13)=>{let t=String(name||'').replace(/\s+/g,' ').trim();if(coordLike(t))t='';if(t.length>m)t=t.slice(0,m-1)+'…';return n?(n+(t?' · ':'')+t):t};
function mapSvg(w){
  const seq=[];
  if(w.start)seq.push({k:'s',id:'start',p:w.start,t:'Start',full:'Start: '+(w.start.name||'')});
  w.locs.forEach((l,i)=>seq.push({k:'l',id:String(l.id),p:l,done:!!l.done,t:lab(i+1,l.name),full:(i+1)+'. '+(l.name||'Bez opisu')}));
  if(w.dest)seq.push({k:'d',id:'dest',p:w.dest,t:lab(0,w.dest.name)||'Meta',full:'Cel: '+(w.dest.name||'')});
  if(!seq.length)return '<div class="mapw empty">Mapa pojawi się, gdy ustawisz start, cel lub dodasz miejsca.</div>';
  const W0=358,H0=270,P=42;
  let pts=seq.map(s=>[s.p.lng,s.p.lat]);
  if(S.fullPL)pts=pts.concat([[14.12,49.0],[24.15,54.84]]);
  const lats=pts.map(p=>p[1]),lngs=pts.map(p=>p[0]);
  const kx=Math.cos(lats.reduce((a,b)=>a+b,0)/lats.length*Math.PI/180);
  let minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lngs),maxLo=Math.max(...lngs);
  if(!S.fullPL){
    const ey=(2.4-(maxLa-minLa))/2;if(ey>0){minLa-=ey;maxLa+=ey}
    const ex=(3.0/kx-(maxLo-minLo))/2;if(ex>0){minLo-=ex;maxLo+=ex}
  }
  const sx=Math.max((maxLo-minLo)*kx,1e-4),sy=Math.max(maxLa-minLa,1e-4);
  const sc=Math.min((W0-2*P)/sx,(H0-2*P)/sy),ox=(W0-sx*sc)/2,oy=(H0-sy*sc)/2;
  seq.forEach(s=>{s.x=ox+(s.p.lng-minLo)*kx*sc;s.y=oy+(maxLa-s.p.lat)*sc});
  const outline='<path class="pl" d="M'+PL.map(p=>(ox+(p[0]-minLo)*kx*sc).toFixed(1)+' '+(oy+(maxLa-p[1])*sc).toFixed(1)).join('L')+'Z"/>';
  const cur=seq.find(s=>s.k==='l'&&!s.done);
  let segs='';
  for(let i=1;i<seq.length;i++){const a=seq[i-1],b=seq[i],g=(b.k==='l'&&b.done)||b.k==='s';
    segs+=`<path class="${g?'sg':'sa'}" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${b.x.toFixed(1)} ${b.y.toFixed(1)}"/>`}
  const boxes=[],order=(cur?[cur]:[]).concat(seq.filter(s=>s!==cur));
  order.forEach(s=>{
    const w1=s.t.length*6.4+4,h=14,r=s===cur?24:11;
    const cand=[[s.x-w1/2,s.y-r-h],[s.x-w1/2,s.y+r],[s.x+r,s.y-h/2],[s.x-r-w1,s.y-h/2]];
    let pick=null,first=null;

  for(let i=0;i<stops.length;i+=10){
    const ch=stops.slice(i,i+10),d=ch[ch.length-1],wp=ch.slice(0,-1);
    let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination='+f(d);
    if(org)u+='&origin='+f(org);

   `<div class="fin-in"><svg class="fin-ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" transform="rotate(-90 60 60)"/><path d="M38 62l16 16 30-34"/></svg>
   <div class="fin-t">KONIEC TRASY</div><div class="fin-s">${esc(w.dest?w.dest.name:'Ostatnie miejsce odwiedzone')}</div>
   <div class="fin-k"><div><b>${v}</b>miejsc</div>${c.km?`<div><b>${Math.round(c.km)} km</b>przejechane</div>`:''}${c.total>0?`<div><b>${money(c.tpp)}</b>na osobę</div>`:''}</div>
   <div class="fin-s" style="margin-bottom:18px">Wyprawa trwa, aż wrócicie do domu.</div><button class="w" data-a="finx">Dalej</button></div>`;
  document.body.appendChild(o);
}
function checkEnd(w){
  if(!w||!w.endAt)return;
  S.seen=S.seen||{};if(S.seen[w.id]===w.endAt)return;
  S.seen[w.id]=w.endAt;save();
  if(Date.now()-w.endAt<6*3600e3)showEnd(w);
}
function stopTrack(){}

async function delPhotos(id){
  db=db||await openDB();if(!db)return;
  const ps=await photos(id);
  for(const p of ps)await new Promise(r=>{const q=st('readwrite').delete(p.id);q.onsuccess=r;q.onerror=r});
}
async function deleteTrip(w){
  const phone=!wide();
  if(!confirm(phone?'Usunąć tę wyprawę z telefonu razem ze zdjęciami?':'Usunąć tę wyprawę z tego urządzenia?'))return;
  if(!phone&&w.cid&&S.worker&&S.key&&confirm('Usunąć też z chmury? Pozostałe urządzenia usuną ją przy najbliższej synchronizacji.')){
    try{
      stamp(w);const d=docOf(w);d.deleted=Date.now();
      await api('/sync/'+w.cid,{method:'POST',body:JSON.stringify(d)});
    }catch(e){alert('Nie udało się usunąć z chmury: '+e.message+' Wyprawa zostanie usunięta tylko tutaj.')}
  }
  if(phone)await delPhotos(w.id);
  S.w=S.w.filter(x=>x.id!==w.id);S.cur=null;save();render();
}

function setTheme(t,persist){
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#0F1B1C':'#F1F5F2';
  document.querySelectorAll('.thm').forEach(b=>{b.innerHTML=t==='dark'?ICON.sun:ICON.moon});
  if(persist)try{localStorage.setItem('urbex_theme',t)}catch(e){}
}
{const cur=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 setTheme(cur,false)}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,w=W();
  if(a==='new')newTripModal();
  else if(a==='open'){S.cur=+b.dataset.id;S.tab='d';save();render();const ow=W();if(ow&&ow.cid)syncTrip(ow)}
  else if(a==='back'){stopTrack();if(w&&w.cid)syncTrip(w);S.cur=null;save();render()}
  else if(a==='tab'){S.tab=b.dataset.t;render()}
  else if(a==='theme')setTheme(curTheme()==='dark'?'light':'dark',true);
  else if(a==='pin'){const el=$('#pinfo');if(!el||!w)return;const id=b.getAttribute('data-id');let t;
    if(id==='start')t='Start: '+((w.start&&w.start.name)||'');
    else if(id==='dest')t='Cel: '+((w.dest&&w.dest.name)||'');
    else{const i=w.locs.findIndex(x=>String(x.id)===id),l=w.locs[i];if(!l)return;t=(i+1)+'. '+(l.name||'Bez opisu')+(l.done?' · odwiedzone '+fmt(l.done):'')}
    el.textContent=t}
  else if(a==='mark'){const c=w.locs.find(l=>!l.done);if(!c)return;
    if(needOdo(w)){askStartOdo(w,()=>{const c2=w.locs.find(l=>!l.done);if(c2)arrive(w,c2,false)});return}
    arrive(w,c,false)}
  else if(a==='nav'){if(needOdo(w)){e.preventDefault();const href=b.href;askStartOdo(w,()=>window.open(href,'_blank','noopener'))}}
  else if(a==='arrdest'){w.arrived=null;w.endAt=Date.now();save();render()}
  else if(a==='arrhome'){askEndOdo(w,()=>{w.homeAt=Date.now();save();render()})}
  else if(a==='unend'){w.endAt=null;w.homeAt=null;save();render()}
  else if(a==='phretry'){retryPh(w)}
  else if(a==='finx'){const f=document.querySelector('.fin');if(f)f.remove()}
  else if(a==='plmap'){S.fullPL=!S.fullPL;save();render()}
  else if(a==='addp'){migrate(w);w.names=w.names||[];let mx=0;w.names.forEach(p=>{const n=parseInt(String(p.i).slice(1));if(n>mx)mx=n});
    w.names=[...w.names,{i:'p'+(mx+1),n:'Osoba '+(w.names.length+1)}];w.people=String(w.names.length);save();viewK(w)}
  else if(a==='delp'){if(!confirm('Usunąć tę osobę z rozliczenia?'))return;w.names=(w.names||[]).filter(p=>p.i!==b.dataset.id);w.people=String(w.names.length);save();viewK(w)}
  else if(a==='adde'){const amt=num($('#ea').value),m=$('#em');if(!(amt>0)){m.textContent='Wpisz kwotę większą od zera.';return}
    w.exp=w.exp||[];w.exp.push({id:Date.now(),desc:$('#ed').value.trim()||'Koszt',amt:$('#ea').value.trim(),who:$('#ew').value||null});save();viewK(w)}
  else if(a==='dele'){if(confirm('Usunąć ten koszt?')){w.exp=(w.exp||[]).filter(e=>String(e.id)!==b.dataset.id);save();viewK(w)}}
  else if(a==='undo'||a==='prev'||a==='undoid'){
    let l;
    if(a==='undoid')l=w.locs.find(x=>String(x.id)===b.dataset.id);
    else if(a==='undo')l=w.arrived&&w.locs.find(x=>x.id===w.arrived.id);
    else l=w.locs.filter(x=>x.done).sort((p,q)=>q.done-p.done)[0];
    if(l){l.done=null;w.endAt=null;w.homeAt=null;if(w.arrived&&w.arrived.id===l.id)w.arrived=null;save();render()}
  }
  else if(a==='addfuel'){
    const o=num($('#fk').value),l=num($('#fl').value),p=num($('#fp').value),m=$('#fm');
    if(!(o>0&&l>0&&p>0)){m.textContent='Wpisz przebieg auta, litry i cenę (wszystkie większe od zera).';return}
    const prevO=Math.max(num(w.odo0),...fuelOf(w).map(x=>num(x.odo)));
    if(prevO>0&&o<=prevO){m.textContent='Przebieg musi być większy niż poprzedni ('+prevO+' km).';return}
    fuelOf(w).push({id:Date.now(),odo:$('#fk').value.trim(),l:$('#fl').value.trim(),p:$('#fp').value.trim(),who:$('#fw').value||null,t:Date.now()});save();viewK(w);
  }
  else if(a==='delfuel'){if(confirm('Usunąć to tankowanie?')){w.fuel=fuelOf(w).filter(x=>String(x.id)!==b.dataset.id);save();viewK(w)}}
  else if(a==='go'){w.arrived=null;save();setTimeout(render,400)}
  else if(a==='dl'){w.locs=w.locs.filter(l=>String(l.id)!==b.dataset.id);w.routed=false;save();render()}
  else if(a==='delw')deleteTrip(w);
  else if(a==='push'){if(!S.worker||!S.key){setSyn('Uzupełnij adres Workera i hasło w Ustawieniach (ekran główny, na dole).');return}
    if(!w.cid)w.cid=String(Date.now());w._dirty=1;save();syncTrip(w,true)}
  else if(a==='pull')listCloud();
  else if(a==='dlc'){const id=b.dataset.id,t=cloudList.find(x=>x.id===id);
    const nw={id:Date.now(),cid:id,name:(t&&t.name)||'Urbex',date:(t&&t.date)||today(),locs:[],pc:0};
    nw._t={m:{},l:{},f:{},dl:{},df:{},e:{},de:{},p:{},dp:{}};nw._v=norm(nw,true);nw._pull=1;
    S.w.push(nw);S.cur=nw.id;S.tab='d';cloudList=cloudList.filter(x=>x.id!==id);save();render();syncTrip(nw,true)}
  else if(a==='wk'){let wk=$('#wk').value.trim().replace(/\/+$/,'');if(wk&&!/^https?:\/\//i.test(wk))wk='https://'+wk;S.worker=wk;S.key=$('#kk').value;save();alert('Zapisano')}
  else if(a==='add')addPlaces();
  else if(a==='sg')setStartGPS();
  else if(a==='ss')setPoint('start','#si');
  else if(a==='ds')setPoint('dest','#di');
  else if(a==='rt'){setMsg('');b.textContent='Układam…';orderRoute(w).then(render)}
});
document.addEventListener('input',e=>{
  const w=W(),i=e.target.id;if(!w)return;
  if(e.target.dataset.lid){const l=w.locs.find(x=>String(x.id)===e.target.dataset.lid);if(l){l[e.target.dataset.f]=e.target.value;save()}return}
  if(i==='rad'){S.rad=+e.target.value||150;save();return}
  if(e.target.dataset.fid){const x=fuelOf(w).find(y=>String(y.id)===e.target.dataset.fid),ff=e.target.dataset.ff;if(x){x[ff]=(ff==='who'&&!e.target.value)?null:e.target.value;save();outK(w)}}
  else if(e.target.dataset.pn){const p=(w.names||[]).find(q=>q.i===e.target.dataset.pn);if(p){p.n=e.target.value;save();outK(w)}}
  else if(e.target.dataset.eid){const x=(w.exp||[]).find(q=>String(q.id)===e.target.dataset.eid),ef=e.target.dataset.ef;if(x){x[ef]=(ef==='who'&&!e.target.value)?null:e.target.value;save();outK(w)}}
  else if(i==='o0'){w.odo0=e.target.value.trim();save();outK(w)}
  else if(i==='o1'){w.odo1=e.target.value.trim();save();outK(w)}
  else if(i==='lw'){w.lodW=e.target.value||null;save();outK(w)}
  else if(i==='car'){w.car=e.target.value;save()}
  else if(i==='ln'||i==='lp'||i==='ll'){w.lodging=w.lodging||{};w.lodging[{ln:'name',lp:'price',ll:'link'}[i]]=e.target.value;save();outK(w);
    if(i==='ll'){const a=$('#lnk'),u=lk(e.target.value);if(a){a.href=u||'#';a.hidden=!u}}}
  else if(i==='wn'){w.name=e.target.value||'Urbex';save()}
  else if(i==='wd'&&e.target.value){w.date=e.target.value;save()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='o-t'){W().tolls=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id==='o-h'){W().hw=e.target.checked;W().routed=false;save();render();return}
  if(e.target.id!=='pf')return;
  const w=W();db=db||await openDB();if(!db){alert('Ta przeglądarka nie pozwala zapisać zdjęć.');return}
  const files=[...e.target.files];let k=0,bad=0;
  for(const f of files){const r=await putP({pid:newPid(),wid:w.id,name:f.name,t:Date.now()+(k++),blob:f});if(r)w.pc=(w.pc||0)+1;else bad++}
  e.target.value='';if(bad)alert('Nie udało się zapisać '+bad+' zdjęć w telefonie (brak miejsca?).');
  save();mountPhotos(w);pumpUp(w);
});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const w=W();if(!w||wide()||S.tab!=='d')return;
  render();
  if(w.arrived||!navigator.geolocation)return;
  const c=w.locs.find(l=>!l.done);
  if(!c){if(w.dest&&!w.endAt&&w.locs.length)navigator.geolocation.getCurrentPosition(p=>{if(!w.endAt&&dist(p.coords.latitude,p.coords.longitude,w.dest.lat,w.dest.lng)<=Math.max(S.rad||150,1500)){w.endAt=Date.now();save();render()}},()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});return}
  navigator.geolocation.getCurrentPosition(p=>{
    if(dist(p.coords.latitude,p.coords.longitude,c.lat,c.lng)<=(S.rad||150)&&!w.arrived&&!c.done)arrive(w,c,true);
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
});
try{window.matchMedia('(min-width:900px)').addEventListener('change',render)}catch(e){}
document.addEventListener('focusout',()=>{if(pend){setTimeout(()=>{if(pend&&!(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)))renderKeep()},700)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const w=W();if(w&&w.cid)syncTrip(w)}});
setInterval(()=>{if(document.visibilityState==='visible'){const w=W();if(w&&w.cid)syncTrip(w)}},15000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pumpUp(W())});
addEventListener('online',()=>pumpUp(W()));
S.w.forEach(migrate);save();
render();
(async()=>{db=db||await openDB();if(db){for(const x of S.w)x.pc=(await photos(x.id)).length;save();paintPh()}pumpUp(W())})();
